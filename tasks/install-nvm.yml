---
- name: Install Node Version Manager
  ansible.builtin.include_role:
    name: onaio.nvm
  vars:
    nvm_user: "{{ enketo_user }}"
    nvm_group: "{{ enketo_group }}"
    nvm_node_version: "{{ enketo_node_version }}"
    nvm_install_path: "{{ enketo_nvm_root }}"
    nvm_node_dir: "{{ enketo_node_dir }}"
    nvm_npm_path: "{{ enketo_npm_path }}"
    nvm_version: "{{ enketo_nvm_version }}"

- name: Install npm global packages
  ansible.builtin.command: "{{ enketo_npm_path }} install -g {{ item.package }}@{{ item.version }}"
  changed_when: true
  with_items:
    - { "package": "grunt-cli", "version": "{{ enketo_grunt_cli_version }}" }
    - { "package": "yarn", "version": "{{ enketo_yarn_version }}" }
  environment:
    PATH: "{{ enketo_node_dir }}/bin:{{ ansible_env.PATH }}"

- name: Install node-gyp
  become: true
  become_user: "{{ enketo_user }}"
  ansible.builtin.command: npm install -g node-gyp
  changed_when: true
  environment:
    PATH: "{{ enketo_node_dir }}/bin:{{ ansible_env.PATH }}"

- name: Install libxmljs
  become: true
  become_user: "{{ enketo_user }}"
  ansible.builtin.command: npm install -g libxmljs
  changed_when: true
  environment:
    PATH: "{{ enketo_node_dir }}/bin:{{ ansible_env.PATH }}"
