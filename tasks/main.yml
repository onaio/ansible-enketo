---
- name: Install Ubuntu related packages
  ansible.builtin.include_tasks: ubuntu.yml
  when: ansible_distribution == 'Ubuntu'

- name: Add Enketo System User
  ansible.builtin.user:
    name: "{{ enketo_user }}"
    shell: /bin/bash
    group: "{{ enketo_group }}"
    force: true
    createhome: true
    home: "{{ enketo_home }}"

- name: Install curl package
  ansible.builtin.apt:
    name: curl

- name: Install NVM and Global Node Packages
  ansible.builtin.include_tasks: install-nvm.yml
  tags:
    - nvm

- name: Configure Redis for Enketo
  ansible.builtin.include_tasks: configure-redis.yml
  tags:
    - redis
  when: enketo_install_redis

- name: Install and configure Enketo
  ansible.builtin.include_tasks: install-enketo.yml
